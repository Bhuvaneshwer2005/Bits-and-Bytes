<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframes</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d1b16; --muted:#6b665a; --line:#cfc8b8;
  --fill:#ebe6d8; --accent:#2f6f6a; --accent-ink:#ffffff; --warn:#a8531a; --warnbg:#f8e6d6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151411; --panel:#1f1d19; --ink:#f1ede2; --muted:#a39d8d; --line:#4a463c;
         --fill:#2a2822; --accent:#6fc2ba; --accent-ink:#0e1a19; --warn:#f0a36a; --warnbg:#3a2a1c; }
}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 48px;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:1.6rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 20px;align-items:start}
figure{margin:0}
figcaption{margin-top:10px;font-size:.9rem;color:var(--muted)}
figcaption b{color:var(--ink)}
.phone{width:100%;max-width:300px;aspect-ratio:9/17;margin:0 auto;border:2px solid var(--ink);border-radius:22px;
  background:var(--panel);padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:600}
.pill{border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600}
.pill.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.box{border:1.5px solid var(--line);border-radius:10px;background:var(--fill);padding:10px;font-size:.8rem}
.drop{border:2px dashed var(--ink);border-radius:12px;padding:22px 10px;text-align:center;font-size:.85rem;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;
  border:1.5px solid var(--ink);font-size:.85rem;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:8px}.row>*{flex:1}
.small{font-size:.72rem;color:var(--muted)}
.card{flex:1;border:2px solid var(--ink);border-radius:14px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;padding:14px;gap:8px;font-weight:600}
.cap{background:#1d1b16;color:#fff;border-radius:8px;padding:8px;font-size:.85rem;text-align:center}
.cap mark{background:var(--accent);color:var(--accent-ink);padding:0 3px;border-radius:3px}
.opt{border:1.5px solid var(--ink);border-radius:10px;min-height:44px;padding:8px 10px;font-size:.82rem;display:flex;align-items:center}
.opt.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.no{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--fill);border:1px solid var(--line);
  font:normal .6rem/1 system-ui;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--fill))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--fill))}
.heat i.l3{background:var(--accent);color:var(--accent-ink)}
.warn{background:var(--warnbg);border:1.5px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:.78rem;font-weight:600}
.field{border:1.5px solid var(--ink);border-radius:8px;padding:8px;font-size:.8rem;min-height:44px;background:var(--panel)}
.steps{display:flex;flex-direction:column;gap:8px;font-size:.82rem}
.steps div{display:flex;gap:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.now{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
</style>
</head>
<body>
<h1>Wireframes</h1>
<p class="lead">Mobile-first, 8 screens. Grey boxes are content, the teal fill is the one primary action per screen. Notes below each screen say which rubric items it serves. App name is a placeholder.</p>

<div class="grid">

<figure>
<div class="phone">
  <div class="bar"><span>[App name]</span><span class="pill acc">4-day streak</span></div>
  <div class="box">Today: <b>6 / 10</b> cards
    <div class="prog" style="margin-top:6px"><i style="width:60%"></i></div></div>
  <div class="drop">Drop your notes PDF here<br><span class="small">or tap to browse · PDF up to 20 MB</span></div>
  <div class="btn pri">Try the sample deck</div>
  <div class="small">Your PDF text is sent to an AI model to build cards.</div>
  <div class="box"><b>Recent decks</b><br>Thermodynamics ch.3 · 32 cards</div>
</div>
<figcaption><b>1. Home / upload.</b> One obvious action. Streak and daily goal visible. Privacy note up front. Sample deck is the fallback for the demo.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>&larr; Back</span><span>ch3-notes.pdf</span></div>
  <div class="box">Pages to use<div class="row" style="margin-top:6px"><div class="field">12</div><div class="field">34</div></div></div>
  <div class="steps" style="margin:8px 0">
    <div><span class="dot done"></span>Reading your PDF</div>
    <div><span class="dot done"></span>Finding the sections</div>
    <div><span class="dot now"></span>Writing cards (3 of 5)</div>
    <div><span class="dot"></span>Checking against your notes</div>
    <div><span class="dot"></span>Building the quiz</div>
  </div>
  <div class="prog"><i style="width:55%"></i></div>
  <div class="small">About 40 seconds left. You can leave this screen open.</div>
</div>
<figcaption><b>2. Page range + progress.</b> Chapter picker for big PDFs. Named stages instead of a blind spinner (UX).</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>&larr; Home</span><span class="pill">AI-generated</span></div>
  <div><b>Thermodynamics ch.3</b><div class="small">32 cards · 5 sections · about 9 min</div></div>
  <div class="warn">2 cards need checking against your notes</div>
  <div class="box">1 · Laws of thermodynamics (7)</div>
  <div class="box">2 · Entropy (8) <span class="small">1 flagged</span></div>
  <div class="box">3 · Heat engines (6)</div>
  <div class="box">4 · Carnot cycle (6) <span class="small">1 flagged</span></div>
  <div class="btn pri" style="margin-top:auto">Start listening</div>
  <div class="btn">Cheat sheet (PDF)</div>
</div>
<figcaption><b>3. Deck overview.</b> Shows the AI-transparency pieces: label, flagged cards, sections. Cheat sheet export lives here.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>Card 4 / 32 · Entropy</span><span class="pill">p. 14</span></div>
  <div class="prog"><i style="width:12%"></i></div>
  <div class="card">
    <span class="small">TERM</span>
    <span style="font-size:1.2rem">What is entropy?</span>
    <span class="small">Tap card to flip</span>
  </div>
  <div class="cap">Entropy is a measure of <mark>disorder</mark> in a system</div>
  <div class="row" style="align-items:center;text-align:center">
    <div class="btn">&#9664;&#9664;</div><div class="btn pri">&#10073;&#10073;</div><div class="btn">&#9654;&#9654;</div>
  </div>
  <div class="row"><div class="btn">Again</div><div class="btn">Got it</div></div>
  <div class="small" style="display:flex;justify-content:space-between"><span>1x speed</span><span>A- A+ captions</span><span>Edit</span></div>
</div>
<figcaption><b>4. Player (the main screen).</b> Voice reads front, then back. Current sentence highlighted in captions. Source page on every card. Controls at 44 px or more.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>Quiz</span><span>Question 3 / 10</span></div>
  <div class="prog"><i style="width:30%"></i></div>
  <div style="font-weight:600">Which quantity never decreases in an isolated system?</div>
  <div class="opt">Energy</div>
  <div class="opt ok">Entropy &#10003;</div>
  <div class="opt no">Pressure &#10007; (your pick)</div>
  <div class="opt">Volume</div>
  <div class="box">Entropy of an isolated system never decreases. <span class="small">Source: page 14</span></div>
  <div class="btn pri" style="margin-top:auto">Next</div>
</div>
<figcaption><b>5. Quiz.</b> Built only from supported cards. Feedback uses an icon and text, not colour alone (accessibility). Explanation cites the page.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>Results</span><span class="pill acc">5-day streak</span></div>
  <div style="font-size:1.6rem;font-weight:700">8 / 10</div>
  <div class="small">Weakest section: Carnot cycle</div>
  <div class="box"><b>Your last 5 weeks</b>
    <div class="heat" style="margin-top:6px">
      <i>0</i><i class="l1">4</i><i class="l2">9</i><i class="l3">14</i><i class="l1">5</i><i>0</i><i class="l2">8</i>
      <i class="l2">10</i><i class="l3">12</i><i class="l1">6</i><i>0</i><i class="l2">9</i><i class="l3">15</i><i class="l3">11</i>
      <i>0</i><i class="l1">3</i><i class="l2">8</i><i class="l3">13</i><i class="l2">10</i><i class="l1">4</i><i class="l3">12</i>
      <i class="l2">9</i><i>0</i><i class="l1">5</i><i class="l3">14</i><i class="l2">9</i><i class="l2">10</i><i class="l3">16</i>
    </div>
    <div class="small" style="margin-top:4px">Numbers are cards studied that day.</div></div>
  <div class="btn pri">Review 2 missed cards</div>
  <div class="btn">Download cheat sheet</div>
</div>
<figcaption><b>6. Results + streak + heatmap.</b> Each heatmap day shows a number, so it does not rely on colour. Demo uses clearly labelled sample history.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>&larr; Cancel</span><span class="pill">Edited by you</span></div>
  <div class="small">Front</div><div class="field">What is entropy?</div>
  <div class="small">Back</div><div class="field" style="min-height:70px">A measure of disorder in a system.</div>
  <div class="small">Source: page 14 · "Entropy is a measure of the disorder..."</div>
  <div class="box"><b>Regenerate with AI</b><div class="field" style="margin-top:6px">Tell it what is wrong (optional)</div></div>
  <div class="row" style="margin-top:auto"><div class="btn">Regenerate</div><div class="btn pri">Save</div></div>
</div>
<figcaption><b>7. Edit card.</b> Human correction is a first-class feature. Edits are marked, and fed into the hand-edit log.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="bar"><span>&larr; Home</span><span>Error states</span></div>
  <div class="warn">We couldn't read text in this PDF. It looks scanned. Try a PDF with selectable text.</div>
  <div class="btn">Choose another file</div>
  <div class="warn">The AI is busy right now. We're showing the sample deck instead.</div>
  <div class="btn pri">Open sample deck</div>
  <div class="box" style="margin-top:auto;text-align:center">No decks yet.<br><span class="small">Drop a PDF above to build your first one.</span></div>
</div>
<figcaption><b>8. Error and empty states.</b> Plain language, one next action each. The AI-failure case falls back visibly to the sample deck.</figcaption>
</figure>

</div>
</body>
</html>
